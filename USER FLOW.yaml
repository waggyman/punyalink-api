Userflow: 
- User Login
  - insert email
  - insert password
  - forgot password
    - insert email again
    - send email OTP to set password + password confirmation
- User Register 1
    - insert email
    - insert name
    - insert subdomain
      - show placeholder subdomain.punyalink.id
  - Send Email OTP to set password + password confirmation
  - Success go to dashboard

- dashboard
  - completing profile banner
    - add profile picture
    - add store title
    - add store description
  - simple stats
    - total link
    - total active link
    - total store view per day
    - total link click per day
  - top 3 clicked link
    - card 1
    - card 2
    - card 3

- my links
  - search bar
  - filter:
    - is public check box
    - is active check box
  - sort:
    - by click times
    - by view times
    - by created date
  - Add new link
  - list (Links Table if Desktop)
    - Image
    - Name
    - Link
    - Total View
    - Total click
    - Is Public
    - Is Active
    - Action
      - Delete
      - Edit

- my temporary collection
  - Simple Stat
    - Total Collection / Allowed Collection
  - create collection
  - list (Collection Table if Desktop)
    - Name
    - Total Link Inside
    - Link

